<title>Acoperiri runda 2</title>
<style>
:root{
  --bg:#f6f5f1;
  --surface:#ffffff;
  --surface-2:#eeece4;
  --ink:#1c2321;
  --ink-dim:#5b6460;
  --line:#d9d5c9;
  --accent:#8a3b2e;
  --accent-ink:#ffffff;
  --node:#2c4a52;
  --node-2:#c98a3c;
  --good:#2f6b4f;
  --bad:#a13a3a;
  --radius:14px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#181a17; --surface:#222521; --surface-2:#2b2e29;
    --ink:#eeece6; --ink-dim:#a8ada4; --line:#3a3d37;
    --accent:#e08b6f; --accent-ink:#1c1310;
    --node:#7fb3bd; --node-2:#e6b16a; --good:#7fc79c; --bad:#e08585;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#181a17; --surface:#222521; --surface-2:#2b2e29;
  --ink:#eeece6; --ink-dim:#a8ada4; --line:#3a3d37;
  --accent:#e08b6f; --accent-ink:#1c1310;
  --node:#7fb3bd; --node-2:#e6b16a; --good:#7fc79c; --bad:#e08585;
  color-scheme: dark;
}
*{box-sizing:border-box;}
body{background:var(--bg); color:var(--ink); font-family:'Source Serif 4',Georgia,serif; padding-inline:16px; padding-block:32px;}
.wrap{max-width:720px; margin:0 auto;}
h1{font-family:'Fraunces',Georgia,serif; font-weight:600; font-size:clamp(1.5rem,5vw,2.1rem); margin:0 0 4px; text-wrap:balance;}
.subtitle{font-family:'Inter',system-ui,sans-serif; color:var(--ink-dim); font-size:0.92rem; margin-bottom:22px;}
svg{max-width:100%; height:auto;}
.graphbox{display:flex; justify-content:center; margin:14px 0; overflow-x:auto;}
.node-circle{fill:var(--node); stroke:var(--bg); stroke-width:3;}
.node-label{font-family:'Inter',sans-serif; font-size:13px; font-weight:700; fill:var(--accent-ink);}
.edge-line{stroke:var(--ink-dim); stroke-width:2;}

.progressbar{position:sticky; top:env(safe-area-inset-top,0px); background:var(--bg); padding-block:10px 4px; z-index:5; margin-bottom:10px;}
.pbar-track{height:6px; background:var(--surface-2); border-radius:999px; overflow:hidden;}
.pbar-fill{height:100%; background:var(--accent); width:0%; transition:width .3s;}
.pbar-label{font-family:'Inter',sans-serif; font-size:0.72rem; color:var(--ink-dim); margin-top:4px;}

.identity-box{
  font-family:'Inter',sans-serif; background:var(--surface-2); border-radius:10px;
  padding:14px 16px; margin-bottom:20px; display:flex; gap:10px; align-items:center; flex-wrap:wrap;
}
.identity-box input{
  flex:1; min-width:140px; padding:8px 10px; border-radius:7px;
  border:1px solid var(--line); background:var(--surface); color:var(--ink); font-family:inherit; font-size:0.9rem;
}

.qcard{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  padding:20px; margin-bottom:16px; font-family:'Inter',system-ui,sans-serif;
}
.qnum{font-size:0.72rem; text-transform:uppercase; letter-spacing:0.06em; color:var(--ink-dim); margin-bottom:6px;}
.qtext{font-family:'Source Serif 4',Georgia,serif; font-size:1.05rem; margin-bottom:14px; line-height:1.5;}
.opts{display:flex; flex-direction:column; gap:8px;}
.opt{
  text-align:left; border:1px solid var(--line); background:var(--surface); color:var(--ink);
  padding:10px 14px; border-radius:8px; cursor:pointer; font-family:inherit; font-size:0.92rem;
  transition:background .15s, border-color .15s;
}
.opt:hover{border-color:var(--accent);}
.opt.correct{background:color-mix(in srgb, var(--good) 22%, var(--surface)); border-color:var(--good); color:var(--good);}
.opt.wrong{background:color-mix(in srgb, var(--bad) 22%, var(--surface)); border-color:var(--bad); color:var(--bad);}
.opt:disabled{cursor:default;}
.fillrow{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
input.fillbox{
  width:64px; padding:7px 8px; border-radius:6px; border:1px solid var(--line);
  background:var(--surface); color:var(--ink); font-family:'JetBrains Mono',monospace; text-align:center; font-size:0.95rem;
}
button.check{
  font-family:'Inter',sans-serif; font-weight:600; font-size:0.85rem;
  background:var(--accent); color:var(--accent-ink); border:none; padding:9px 18px; border-radius:8px; cursor:pointer; margin-top:10px;
}
button.check:hover{opacity:0.9;}
button.check:disabled{opacity:0.5; cursor:default;}
.feedback{margin-top:10px; font-size:0.88rem; display:none;}
.feedback.show{display:block;}

.resultbox{
  background:var(--surface); border:2px solid var(--accent); border-radius:var(--radius);
  padding:28px 24px; text-align:center; font-family:'Inter',sans-serif; display:none;
}
.resultbox.show{display:block;}
.resultbox .score{font-family:'Fraunces',Georgia,serif; font-size:2.6rem; font-weight:700; color:var(--accent); margin-bottom:6px;}
.resultbox .msg{font-size:0.95rem; color:var(--ink-dim); margin-bottom:4px;}

:root{--c-purple:#6b4fa0;--c-pink:#b0417a;--c-teal:#1f7a7a;--c-blue:#2f5f9e;}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--c-purple:#b9a3e6;--c-pink:#ec9cc4;--c-teal:#79cccc;--c-blue:#9dbdf0;}}
:root[data-theme="dark"]{--c-purple:#b9a3e6;--c-pink:#ec9cc4;--c-teal:#79cccc;--c-blue:#9dbdf0;}
.wrap{max-width:900px;}
.section{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;margin-bottom:22px;}
.section h2{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:1.35rem;margin:0 0 10px;display:flex;gap:10px;align-items:center;text-wrap:balance;}
.section h2 .num{font-family:'Inter',sans-serif;font-size:0.75rem;font-weight:700;background:var(--accent);color:var(--accent-ink);border-radius:999px;width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;flex:none;}
.section p{line-height:1.6;margin:0 0 12px;}
.toc{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px;font-family:'Inter',sans-serif;font-size:0.82rem;}
.toc a{color:var(--ink);text-decoration:none;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 10px;}
.tip{font-family:'Inter',sans-serif;background:var(--surface-2);border-radius:10px;padding:12px 14px;margin:10px 0;line-height:1.55;font-size:0.92rem;border-left:4px solid var(--c,var(--accent));}
.tip h4{margin:0 0 4px;font-size:0.95rem;}
.tip .big{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:1.05rem;}
.tablewrap{overflow-x:auto;}
table.lv{width:100%;border-collapse:collapse;font-family:'Inter',sans-serif;font-size:0.86rem;}
table.lv th,table.lv td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top;}
table.lv th{font-size:0.72rem;text-transform:uppercase;letter-spacing:0.05em;color:var(--ink-dim);}
.dot{display:inline-block;width:10px;height:10px;border-radius:999px;margin-right:6px;vertical-align:0;background:var(--c);}
.tbtn{font-family:'Inter',sans-serif;font-weight:600;font-size:0.86rem;background:var(--surface);color:var(--ink);border:1px solid var(--line);padding:8px 13px;border-radius:8px;cursor:pointer;}
.tbtn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);}
.tbtn:disabled{opacity:0.45;cursor:default;}
.tbtn:focus-visible,.card:focus-visible,.mitem:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.card{perspective:1000px;height:220px;cursor:pointer;margin:10px 0;border:none;background:none;width:100%;padding:0;}
.card .in{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d;}
.card.flip .in{transform:rotateY(180deg);}
.card .f,.card .b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:14px;border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;text-align:center;font-family:'Inter',sans-serif;}
.card .f{background:var(--surface-2);font-family:'Fraunces',Georgia,serif;font-size:1.5rem;font-weight:600;color:var(--ink);}
.card .b{background:var(--surface);transform:rotateY(180deg);font-size:0.98rem;line-height:1.5;color:var(--ink);}
.card .b .hintc{margin-top:10px;font-size:0.84rem;color:var(--ink-dim);}
.card small{font-family:'Inter',sans-serif;font-size:0.75rem;color:var(--ink-dim);font-weight:500;margin-top:10px;}
@media (prefers-reduced-motion: reduce){.card .in{transition:none;}}
.stat{font-family:'Inter',sans-serif;font-size:0.85rem;color:var(--ink-dim);}
.mgrid{display:grid;grid-template-columns:1fr 1.6fr;gap:10px;}
@media (max-width:620px){.mgrid{grid-template-columns:1fr;}}
.mcol{display:flex;flex-direction:column;gap:8px;}
.mitem{font-family:'Inter',sans-serif;font-size:0.88rem;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 12px;border-radius:9px;cursor:pointer;line-height:1.4;}
.mitem.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--surface));}
.mitem.done{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--surface));color:var(--good);cursor:default;}
.mitem.shake{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--surface));}
.gbox{display:flex;justify-content:center;}
.gbox svg{max-width:100%;height:auto;user-select:none;-webkit-user-select:none;}
.checks{display:flex;flex-direction:column;gap:6px;font-family:'Inter',sans-serif;font-size:0.92rem;margin:10px 0;}
.checks label{display:flex;gap:8px;align-items:center;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer;}
.checks label.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--surface));}
.checks label.miss{border-color:var(--node-2);background:color-mix(in srgb,var(--node-2) 16%,var(--surface));}
.checks label.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--surface));}
.note{font-family:'Inter',sans-serif;font-size:0.9rem;background:var(--surface-2);border-radius:8px;padding:10px 14px;line-height:1.5;min-height:1.5em;}
.qwrap{font-family:'Inter',sans-serif;}
.qtext{font-family:'Fraunces',Georgia,serif;font-size:1.12rem;margin:8px 0 12px;line-height:1.45;}
.hintbox{font-family:'Inter',sans-serif;font-size:0.88rem;background:color-mix(in srgb,var(--node-2) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--node-2) 45%,transparent);border-radius:8px;padding:9px 12px;margin-top:8px;}
.bar{height:6px;background:var(--surface-2);border-radius:999px;overflow:hidden;margin:6px 0 12px;}
.bar > div{height:100%;background:var(--accent);width:0;transition:width .3s;}
</style>
<style>
.node-circle.on{fill:var(--node-2);}
.edge-line.okE{stroke:var(--good);stroke-width:4;}
.edge-line.badE{stroke:var(--bad);stroke-width:4;stroke-dasharray:6 4;}
.pick .node-circle{cursor:pointer;}
.verdict{font-family:'Inter',sans-serif;font-size:0.9rem;line-height:1.6;margin-top:8px;}
.legend{font-family:'Inter',sans-serif;font-size:0.82rem;color:var(--ink-dim);}
</style>
<style>.step{margin-top:12px;padding-top:10px;border-top:1px dashed var(--line);font-family:'Inter',sans-serif;}
.step h4{margin:0 0 8px;font-size:0.92rem;}.chips{display:flex;gap:8px;flex-wrap:wrap;}
.chip{font-family:'Inter',sans-serif;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:999px;cursor:pointer;font-size:0.9rem;}
.chip.sel{background:var(--node-2);color:#1c1310;border-color:var(--node-2);}.chip:disabled{cursor:default;opacity:.8;}
.fb{font-size:0.88rem;margin-top:6px;line-height:1.6;}</style>
<div class="wrap">
<h1>Acoperiri de vârfuri: runda 2</h1>
<div class="subtitle">7 exerciții, fiecare rezolvat în 3 pași, în ordine</div>
<div class="identity-box"><span>Numele tău:</span><input id="who" value="Vitea" aria-label="Numele tău"></div>
<div class="tip" style="--c:var(--c-teal)"><h4>Acoperire de VÂRFURI</h4>Alegi vârfuri (portocaliu). Fiecare <b>muchie</b> trebuie să aibă cel puțin un capăt portocaliu. Vârfurile alese au voie să fie vecine.</div>
<div id="tasks"></div>
<div class="resultbox" id="res"><div class="score" id="score"></div><div class="msg" id="msg"></div></div>
</div>
<script>
const G={
 A:{pos:{1:[60,50],2:[60,170],3:[170,110],4:[300,110]},e:[[1,2],[1,3],[2,3],[3,4]],w:360,h:220},
 SQ:{pos:{1:[70,50],2:[230,50],3:[230,190],4:[70,190]},e:[[1,2],[2,3],[3,4],[4,1]],w:300,h:240},
 STAR:{pos:{1:[160,110],2:[60,40],3:[260,40],4:[60,180],5:[260,180]},e:[[1,2],[1,3],[1,4],[1,5]],w:320,h:220},
 P5:{pos:{1:[40,60],2:[130,60],3:[220,60],4:[310,60],5:[400,60]},e:[[1,2],[2,3],[3,4],[4,5]],w:440,h:120},
 HOUSE:{pos:{5:[150,40],1:[70,120],2:[230,120],4:[70,240],3:[230,240]},e:[[1,2],[2,3],[3,4],[4,1],[1,5],[2,5]],w:300,h:280}};
const cover=(S,g)=>g.e.every(([a,b])=>S.has(a)||S.has(b));
function beta(g){const V=Object.keys(g.pos).map(Number);let best=99;for(let m=0;m<1<<V.length;m++){const S=new Set(V.filter((v,i)=>m>>i&1));if(cover(S,g))best=Math.min(best,S.size);}return best;}
function classify(S,g){if(!cover(S,g))return 0;const rem=[...S].filter(v=>{const t=new Set(S);t.delete(v);return cover(t,g);});if(rem.length)return 1;return S.size===beta(g)?3:2;}
const LAB=["nu e acoperire","acoperire, dar NU minimală","minimală, dar nu minimă","minimă (și minimală)"];
function draw(el,g,S,show,onClick){
 let s=`<svg viewBox="0 0 ${g.w} ${g.h}" width="${g.w}">`;
 for(const[a,b]of g.e){const[x1,y1]=g.pos[a],[x2,y2]=g.pos[b];const c=show?((S.has(a)||S.has(b))?' okE':' badE'):'';s+=`<line class="edge-line${c}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`;}
 for(const v in g.pos){const[x,y]=g.pos[v];s+=`<g data-v="${v}"><circle class="node-circle${S.has(+v)?' on':''}" cx="${x}" cy="${y}" r="20"/><text class="node-label" x="${x}" y="${y+5}" text-anchor="middle" pointer-events="none">${v}</text></g>`;}
 el.innerHTML=s+'</svg>';
 if(onClick)el.querySelectorAll('g[data-v]').forEach(n=>n.onclick=()=>onClick(+n.dataset.v));}
const fmt=S=>'{'+[...S].sort((a,b)=>a-b).join(', ')+'}';
function explain(S,g){
 const un=g.e.filter(([a,b])=>!S.has(a)&&!S.has(b)).map(e=>e.join('–'));
 if(un.length)return `Muchii neatinse: <b>${un.join(', ')}</b>, deci nu e acoperire.`;
 let t='Toate muchiile sunt atinse ✔<br>';
 for(const v of [...S].sort((a,b)=>a-b)){const r=new Set(S);r.delete(v);const u=g.e.filter(([a,b])=>!r.has(a)&&!r.has(b)).map(e=>e.join('–'));
  t+=`Scot ${v}: `+(u.length?`rămâne neatinsă ${u.join(', ')} ✗<br>`:`tot e acoperire, deci ${v} era în plus!<br>`);}
 return t+`β0 al acestui graf = <b>${beta(g)}</b>.`;}
const T=[{g:'A',S:[1,3]},{g:'SQ',S:[1,2,3]},{g:'STAR',S:[1,2]},{g:'P5',S:[2,3,5]},{g:'HOUSE',S:[1,2,4]},{g:'P5',S:[1,2,3]},{g:'P5',S:[1,2,4]}];
const ans=[];let score=0,done=0,db=null;
(async()=>{try{db=await window.claude.use('db');}catch(e){}})();
function slug(s){return(s||'anonim').trim().toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'')||'anonim';}
async function save(){if(!db)return;const n=who.value;try{await db.doc('practice/'+slug(n)+'-acoperiri2').set({name:n,score,total:T.length,done,answers:ans,updatedAt:new Date().toISOString()});}catch(e){}}
const OK=t=>`<b style="color:var(--good)">✔ ${t}</b>`,KO=t=>`<b style="color:var(--bad)">✗ ${t}</b>`;
function yesno(el,labels,cb){const c=document.createElement('div');c.className='chips';labels.forEach((l,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=l;b.onclick=()=>{c.querySelectorAll('button').forEach(x=>x.disabled=true);b.classList.add('sel');cb(j);};c.appendChild(b);});el.appendChild(c);}
T.forEach((t,i)=>{const g=G[t.g],S=new Set(t.S);const d=document.createElement('div');d.className='qcard';
 const isC=cover(S,g);const rem=[...S].filter(v=>{const r=new Set(S);r.delete(v);return cover(r,g);});const b0=beta(g);
 const rec={q:t.g+' '+fmt(S),steps:[]};let allOk=true;
 d.innerHTML=`<div class="qnum">Exercițiul ${i+1} / ${T.length}</div><div class="qtext">Mulțimea <b>${fmt(S)}</b></div><div class="gbox"></div>`;
 const gb=d.querySelector('.gbox');draw(gb,g,S,false);
 const end=()=>{if(allOk)score++;done++;ans[i]=Object.assign(rec,{ok:allOk});save();if(done===T.length){res.classList.add('show');document.getElementById('score').textContent=score+' / '+T.length;msg.textContent=score>=6?'Super, pașii funcționează!':'Uită-te la pașii cu roșu.';}};
 const s1=document.createElement('div');s1.className='step';s1.innerHTML='<h4>Pasul 1. Verifică fiecare muchie: are un capăt portocaliu? E acoperire?</h4>';d.appendChild(s1);
 yesno(s1,['Da, e acoperire','Nu e acoperire'],j=>{const ok=(j===0)===isC;allOk&&=ok;rec.steps.push({step:1,ok});draw(gb,g,S,true);
  const f=document.createElement('div');f.className='fb';f.innerHTML=(ok?OK('Corect.'):KO('Nu.'))+' '+explain(S,g).split('<br>')[0];s1.appendChild(f);
  if(!isC){end();return;}
  const s2=document.createElement('div');s2.className='step';s2.innerHTML='<h4>Pasul 2. Scoate pe rând fiecare vârf portocaliu. Care se pot scoate, astfel încât să rămână tot acoperire? (Poți alege mai multe, sau „niciunul”.)</h4>';d.appendChild(s2);
  const pick=new Set();const c=document.createElement('div');c.className='chips';const btns=[];
  [...S].sort((a,b)=>a-b).forEach(v=>{const b=document.createElement('button');b.className='chip';b.textContent='scot '+v;b.onclick=()=>{pick.has(v)?pick.delete(v):pick.add(v);b.classList.toggle('sel');};c.appendChild(b);btns.push(b);});
  const go=document.createElement('button');go.className='check';go.textContent='Gata (dacă n-ai ales nimic = niciunul)';s2.appendChild(c);s2.appendChild(go);
  go.onclick=()=>{go.disabled=true;btns.forEach(b=>b.disabled=true);const ok=pick.size===rem.length&&rem.every(v=>pick.has(v));allOk&&=ok;rec.steps.push({step:2,ok,chosen:[...pick],correct:rem});
   const f=document.createElement('div');f.className='fb';f.innerHTML=(ok?OK('Corect.'):KO('Nu. Se pot scoate: '+(rem.length?rem.join(', '):'niciunul')+'.'))+'<br>'+explain(S,g).split('<br>').slice(1,-1).join('<br>')+'<br>'+(rem.length?'Deci <b>NU e minimală</b>.':'Deci e <b>minimală</b> (blocată).');s2.appendChild(f);
   if(rem.length){end();return;}
   const s3=document.createElement('div');s3.className='step';s3.innerHTML=`<h4>Pasul 3. β0 al acestui graf este <b>${b0}</b>. Mulțimea are ${S.size} vârfuri. Este minimă?</h4>`;d.appendChild(s3);
   yesno(s3,['Da, e minimă','Nu, e doar minimală'],j=>{const ok=(j===0)===(S.size===b0);allOk&&=ok;rec.steps.push({step:3,ok});
    const f=document.createElement('div');f.className='fb';f.innerHTML=(ok?OK('Corect.'):KO('Nu.'))+(S.size===b0?` ${S.size} = β0, deci e minimă.`:` ${S.size} > β0 = ${b0}, deci e minimală, dar nu minimă.`);s3.appendChild(f);end();});};});
 tasks.appendChild(d);});
</script>
