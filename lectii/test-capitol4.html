<style>

}
:root[data-theme="dark"]{

}
*{box-sizing:border-box;}
body{background:var(--bg); color:var(--ink); font-family:'Source Serif 4',Georgia,serif; padding-inline:16px; padding-block:32px;}
.wrap{max-width:720px; margin:0 auto;}
h1{font-family:'Fraunces',Georgia,serif; font-weight:600; font-size:clamp(1.5rem,5vw,2.1rem); margin:0 0 4px; text-wrap:balance;}
.subtitle{font-family:'Inter',system-ui,sans-serif; color:var(--ink-dim); font-size:0.92rem; margin-bottom:22px;}
svg{max-width:100%; height:auto;}
.graphbox{display:flex; justify-content:center; margin:14px 0; overflow-x:auto;}
.node-circle{fill:var(--node); stroke:var(--bg); stroke-width:3;}
.node-label{font-family:'Inter',sans-serif; font-size:13px; font-weight:700; fill:var(--accent-ink);}
.edge-line{stroke:var(--ink-dim); stroke-width:2;}

.progressbar{position:sticky; top:env(safe-area-inset-top,0px); background:var(--bg); padding-block:10px 4px; z-index:5; margin-bottom:10px;}

.identity-box{
  font-family:'Inter',sans-serif; background:var(--surface-2); border-radius:10px;
  padding:14px 16px; margin-bottom:20px; display:flex; gap:10px; align-items:center; flex-wrap:wrap;
}
.identity-box input{
  flex:1; min-width:140px; padding:8px 10px; border-radius:7px;
  border:1px solid var(--line); background:var(--surface); color:var(--ink); font-family:inherit; font-size:0.9rem;
}

.qcard{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  padding:20px; margin-bottom:16px; font-family:'Inter',system-ui,sans-serif;
}
.qnum{font-size:0.72rem; text-transform:uppercase; letter-spacing:0.06em; color:var(--ink-dim); margin-bottom:6px;}
.qtext{font-family:'Source Serif 4',Georgia,serif; font-size:1.05rem; margin-bottom:14px; line-height:1.5;}
.opts{display:flex; flex-direction:column; gap:8px;}
.opt{
  text-align:left; border:1px solid var(--line); background:var(--surface); color:var(--ink);
  padding:10px 14px; border-radius:8px; cursor:pointer; font-family:inherit; font-size:0.92rem;
  transition:background .15s, border-color .15s;
}
.opt:hover{border-color:var(--accent);}
.opt.correct{background:color-mix(in srgb, var(--good) 22%, var(--surface)); border-color:var(--good); color:var(--good);}
.opt.wrong{background:color-mix(in srgb, var(--bad) 22%, var(--surface)); border-color:var(--bad); color:var(--bad);}
.opt:disabled{cursor:default;}
.fillrow{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
input.fillbox{
  width:64px; padding:7px 8px; border-radius:6px; border:1px solid var(--line);
  background:var(--surface); color:var(--ink); font-family:'JetBrains Mono',monospace; text-align:center; font-size:0.95rem;
}
button.check{
  font-family:'Inter',sans-serif; font-weight:600; font-size:0.85rem;
  background:var(--accent); color:var(--accent-ink); border:none; padding:9px 18px; border-radius:8px; cursor:pointer; margin-top:10px;
}
button.check:hover{opacity:0.9;}
button.check:disabled{opacity:0.5; cursor:default;}
.feedback{margin-top:10px; font-size:0.88rem; display:none;}
.feedback.show{display:block;}

.resultbox{
  background:var(--surface); border:2px solid var(--accent); border-radius:var(--radius);
  padding:28px 24px; text-align:center; font-family:'Inter',sans-serif; display:none;
}
.resultbox.show{display:block;}
.resultbox .score{font-family:'Fraunces',Georgia,serif; font-size:2.6rem; font-weight:700; color:var(--accent); margin-bottom:6px;}
.resultbox .msg{font-size:0.95rem; color:var(--ink-dim); margin-bottom:4px;}

.wrap{max-width:900px;}
.section{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;margin-bottom:22px;}
.section h2{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:1.35rem;margin:0 0 10px;display:flex;gap:10px;align-items:center;text-wrap:balance;}
.section h2 .num{font-family:'Inter',sans-serif;font-size:0.75rem;font-weight:700;background:var(--accent);color:var(--accent-ink);border-radius:999px;width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;flex:none;}
.section p{line-height:1.65;margin:0 0 12px;}
.rule{font-family:'Inter',sans-serif;background:var(--surface-2);border-left:3px solid var(--accent);border-radius:6px;padding:12px 16px;margin:12px 0;font-size:0.95rem;line-height:1.55;}
.rule.warn{border-left-color:var(--node-2);}
.wg{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:14px;align-items:start;margin-top:10px;}
@media (max-width:760px){.wg{grid-template-columns:1fr;}}
.wg .board{background:var(--bg);border:1px solid var(--line);border-radius:12px;overflow:hidden;}

.pill.na{background:var(--line);color:var(--ink-dim);}
.why{color:var(--ink-dim);font-size:0.82rem;display:block;margin-top:2px;}
.wbtns{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;}
.tbtn{font-family:'Inter',sans-serif;font-weight:600;font-size:0.82rem;background:var(--surface);color:var(--ink);border:1px solid var(--line);padding:7px 11px;border-radius:8px;cursor:pointer;}
.tbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.hintline{font-family:'Inter',sans-serif;font-size:0.82rem;color:var(--ink-dim);margin-top:6px;}
.vtx{cursor:pointer;}
.ehit{stroke:transparent;stroke-width:20;cursor:pointer;}
.toc{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px;font-family:'Inter',sans-serif;font-size:0.82rem;}
.toc a{color:var(--ink);text-decoration:none;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 10px;}
.cheat{width:100%;border-collapse:collapse;font-family:'Inter',sans-serif;font-size:0.88rem;}
.cheat th,.cheat td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top;}
.cheat th{font-size:0.75rem;text-transform:uppercase;letter-spacing:0.05em;color:var(--ink-dim);}
.tablewrap{overflow-x:auto;}
.gbadge{display:inline-block;font-size:0.72rem;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:2px 9px;margin-bottom:6px;}
.nobadge{display:inline-block;font-size:0.72rem;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;background:var(--line);color:var(--ink-dim);border-radius:999px;padding:2px 9px;margin-bottom:6px;}
.swrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-family:'Inter',sans-serif;font-size:0.88rem;margin-bottom:8px;}
.swrow select{font-family:'Inter',sans-serif;font-size:0.88rem;padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);}
.quiz{font-family:Inter,sans-serif;background:var(--surface-2);border-radius:10px;padding:14px;margin-top:12px;}
.quiz .q{font-weight:600;margin-bottom:10px;}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
@media (max-width:640px){.cmp{grid-template-columns:1fr;}}
.cmp .card{background:var(--surface-2);border-radius:10px;padding:12px;font-family:'Inter',sans-serif;font-size:0.88rem;}

.wlabel{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700;fill:var(--ink);}
.wbg{fill:var(--surface);stroke:var(--line);stroke-width:1;}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0;}
@media (max-width:640px){.cmp{grid-template-columns:1fr;}}
.card{font-family:'Inter',sans-serif;background:var(--surface-2);border-radius:10px;padding:12px 14px;font-size:0.92rem;line-height:1.55;}
.quiz{background:var(--surface-2);border-radius:12px;padding:14px 16px;margin:12px 0;font-family:'Inter',sans-serif;}
.quiz .q{font-family:'Source Serif 4',Georgia,serif;font-size:1rem;margin-bottom:10px;line-height:1.5;}
.gbadge,.nobadge{font-size:0.7rem;font-weight:700;border-radius:999px;padding:2px 8px;margin-right:6px;background:var(--accent);color:var(--accent-ink);}
.nobadge{background:var(--line);color:var(--ink-dim);}
.steplog{font-size:0.82rem;line-height:1.45;max-height:210px;overflow:auto;margin-top:8px;}
.steplog div{padding:3px 0;border-top:1px dashed var(--line);}
.steplog .ok{color:var(--good);} .steplog .no{color:var(--bad);}
.swrow{font-family:'Inter',sans-serif;font-size:0.9rem;margin:10px 0;display:flex;gap:8px;align-items:center;flex-wrap:wrap;}

.wlabel{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700;fill:var(--ink);}
.wbg{fill:var(--surface);stroke:var(--line);stroke-width:1;}
.gbadge{font-size:0.7rem;font-weight:700;border-radius:999px;padding:2px 8px;margin-left:6px;background:var(--accent);color:var(--accent-ink);}
</style>

<div class="wrap" style="max-width:720px">

</div>
<script>
(function(){
  const NS='http://www.w3.org/2000/svg';

  const G={W:640,H:490,pos:{1:[80,70],2:[230,70],3:[380,70],4:[230,200],5:[380,200],6:[300,330],7:[480,330],8:[300,440]},
    E:[[1,2,4],[1,3,9],[2,3,2],[2,4,8],[3,4,7],[3,5,6],[4,5,3],[4,6,10],[5,6,5],[5,7,12],[6,7,1],[6,8,11],[7,8,13]]};

    Object.entries(G.pos).forEach(([id,[x,y]])=>{ const g=mk('g',{}); g.appendChild(mk('circle',{class:'node-circle',cx:x,cy:y,r:19}));

  }
  const Q=[{"t": "fill", "q": "O pădure are 15 vârfuri și 4 componente conexe. Câte muchii are?", "a": "11", "e": "m = n − k = 15 − 4 = 11. Fiecare componentă e un arbore, deci „pierde” câte o muchie față de numărul ei de vârfuri.", "g": 0}, {"t": "mc", "q": "Un graf are 9 vârfuri, 8 muchii și are cel puțin un ciclu. Ce știm sigur despre el?", "a": [["Nu e conex", 1], ["E arbore", 0], ["E conex, dar are ciclu", 0]], "e": "Dacă ar fi conex, cu m = n − 1 ar fi arbore și n-ar avea ciclu. Deci nu e conex.", "g": 0}, {"t": "fill", "q": "Un graf conex are 10 vârfuri și 14 muchii. Câte muchii trebuie scoase, minim, ca să obții un arbore parțial?", "a": "5", "e": "Un arbore parțial are n − 1 = 9 muchii. Ai 14, deci scoți 14 − 9 = 5 (câte una din fiecare ciclu rămas).", "g": 0}, {"t": "mc", "q": "Scoți o muchie dintr-un arbore cu 10 vârfuri. Ce obții?", "a": [["O pădure cu 2 componente și 8 muchii", 1], ["Un arbore cu 9 muchii", 0], ["O pădure cu 2 componente și 9 muchii", 0]], "e": "Arborele avea 9 muchii. Scoți una: 8. Se rupe în 2 arbori (m = n − k = 10 − 2 = 8).", "g": 0}, {"t": "mc", "q": "Care afirmație este FALSĂ?", "a": [["Un graf conex are exact un singur arbore parțial", 1], ["Orice arbore parțial al unui graf cu n vârfuri are n − 1 muchii", 0], ["Un arbore parțial conține toate vârfurile grafului", 0]], "e": "Un graf conex cu cicluri are de obicei mai mulți arbori parțiali (poți scoate muchii diferite din cicluri).", "g": 0}, {"t": "mc", "q": "Un graf conex are n vârfuri și exact n muchii. Câte cicluri are?", "a": [["Exact unul", 1], ["Niciunul", 0], ["Cel puțin două", 0]], "e": "Arbore (n − 1 muchii) + încă o muchie = exact un ciclu.", "g": 0}, {"t": "fill", "q": "Care e costul arborelui parțial de cost minim al grafului de mai sus?", "a": "32", "e": "Kruskal: 1 + 2 + 3 + 4 + 5 + 6 + 11 = 32 (muchiile 6–7, 2–3, 4–5, 1–2, 5–6, 3–5, 6–8).", "g": 1}, {"t": "mc", "q": "Kruskal pe graful de mai sus. Care e a 4-a muchie LUATĂ în arbore?", "a": [["1–2 (cost 4)", 1], ["3–4 (cost 7)", 0], ["2–4 (cost 8)", 0]], "e": "Ordinea luată: 6–7 (1), 2–3 (2), 4–5 (3), 1–2 (4).", "g": 1}, {"t": "mc", "q": "Kruskal pe același graf. Care e prima muchie SĂRITĂ (pentru că face ciclu)?", "a": [["3–4 (cost 7)", 1], ["3–5 (cost 6)", 0], ["5–6 (cost 5)", 0]], "e": "Până la costul 6 s-au luat toate. La 3–4 (7): 3 și 4 sunt deja legate prin 3–5–4, deci ar face ciclu.", "g": 1}, {"t": "fill", "q": "Câte muchii sare Kruskal pe acest graf, în total, până se oprește?", "a": "4", "e": "Sărite: 3–4 (7), 2–4 (8), 1–3 (9), 4–6 (10). Apoi ia 6–8 (11) și are 7 = n − 1 muchii.", "g": 1}, {"t": "mc", "q": "Prim pornit din vârful 1. Care e a 3-a muchie adăugată?", "a": [["3–5 (cost 6)", 1], ["1–3 (cost 9)", 0], ["2–4 (cost 8)", 0]], "e": "Pas 1: 1–2 (4). Pas 2: 2–3 (2). Pas 3: din {1,2,3} ies 1–3? nu (ambele capete în arbore), 2–4 (8), 3–4 (7), 3–5 (6) → se ia 3–5.", "g": 1}, {"t": "mc", "q": "Prim pornit din vârful 6. Care e prima muchie aleasă?", "a": [["6–7 (cost 1)", 1], ["5–6 (cost 5)", 0], ["6–8 (cost 11)", 0]], "e": "Din {6} ies 4–6 (10), 5–6 (5), 6–7 (1), 6–8 (11). Cea mai ieftină: 6–7.", "g": 1}, {"t": "fill", "q": "Pornești Prim din vârful 8. Care e costul final al arborelui?", "a": "32", "e": "Alt start, același cost minim: 32. Se schimbă ordinea muchiilor, nu rezultatul.", "g": 1}, {"t": "mc", "q": "Vârful 8 are doar muchiile 6–8 (11) și 7–8 (13). Care intră în APM?", "a": [["Doar 6–8", 1], ["Doar 7–8", 0], ["Amândouă", 0]], "e": "6–7 (cost 1) e deja în APM. Dacă ai pune ambele muchii ale lui 8, ar apărea ciclul 6–7–8. Se ia cea mai ieftină: 6–8.", "g": 1}, {"t": "mc", "q": "Muchia 3–4 (cost 7) intră în APM?", "a": [["Nu: 3 și 4 se leagă mai ieftin prin 3–5–4 (6 + 3)", 1], ["Da, 7 e un cost mic", 0], ["Da, pentru că 3 și 4 nu sunt vecini în arbore", 0]], "e": "Ciclul 3–4–5–3 are muchiile 7, 6, 3. Cea mai scumpă din ciclu (7) nu e necesară.", "g": 1}, {"t": "fill", "q": "Costul muchiei 2–3 crește de la 2 la 20. Care e acum costul APM?", "a": "38", "e": "Noul APM nu mai folosește 2–3 (20). Vârful 2 se leagă acum prin 2–4 (8), iar 3 prin 3–5 (6). Muchiile: 6–7, 4–5, 1–2, 5–6, 3–5, 2–4, 6–8 = 1 + 3 + 4 + 5 + 6 + 8 + 11 = 38.", "g": 1}];
  const N=Q.length, results={}; let done=0, right=0;

      r.scrollIntoView({behavior:'smooth',block:'center'}); } }
  let db=null;

    } else {
      const r=document.createElement('div'); r.className='fillrow'; r.innerHTML='<input class="fillbox" type="text" inputmode="numeric" autocomplete="off"><button class="check">Verifică</button>';
      const inp=r.querySelector('input'), btn=r.querySelector('button');
      btn.onclick=()=>{ if(btn.disabled||!inp.value.trim()) return; btn.disabled=true; inp.disabled=true; finish(card,i,inp.value.trim()===q.a,fb); };
      inp.addEventListener('keydown',e=>{ if(e.key==='Enter') btn.click(); });
      card.appendChild(r);
    }
    card.appendChild(fb); root.appendChild(card);
  });
  try{ const s=localStorage.getItem('graf_student_name'); if(s) document.getElementById('studentName').value=s; }catch(e){}
  document.getElementById('studentName').addEventListener('change', save);
  (async function(){ try{ if(window.claude && window.claude.use) db = await window.claude.use('db'); }catch(e){} })();
  upd();
})();
